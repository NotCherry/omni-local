name: CI and release builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Linux audio and GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libportaudio2 python3-tk xvfb
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_client
      - name: Open GUI with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python app.py --smoke-test
      - name: Open GUI on Windows
        if: runner.os == 'Windows'
        run: python app.py --smoke-test

  build:
    name: Package (${{ matrix.os }})
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Linux audio libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libportaudio2 python3-tk
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name OmniLocal --collect-all sounddevice --collect-all _sounddevice_data app.py
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/OmniLocal.exe, README.md, LICENSE release/
          Compress-Archive -Path release/* -DestinationPath OmniLocal-windows-x64.zip
      - name: Package Linux release
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          cp dist/OmniLocal README.md LICENSE release/
          tar -C release -czf OmniLocal-linux-x64.tar.gz OmniLocal README.md LICENSE
      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: OmniLocal-windows-x64
          path: OmniLocal-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: OmniLocal-linux-x64
          path: OmniLocal-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OmniLocal-*
          merge-multiple: true
          path: release-assets
      - name: Publish both platform packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Omni Local $GITHUB_REF_NAME" \
            --generate-notes
